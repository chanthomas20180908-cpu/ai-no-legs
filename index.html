<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ai-no-legs | Stay curious, stay real</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f4ef;
      --ink: #111111;
      --muted: #6b6560;
      --accent: #b7410e;
      --line: #d8d4cc;
      --card: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Noto Serif SC", "Source Han Serif CN", "Songti SC", "STSong", "SimSun", serif;
      background-color: var(--bg);
      color: var(--ink);
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: -1;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 80px 24px 120px;
    }

    header {
      margin-bottom: 72px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 48px;
      animation: fadeInUp 0.8s ease-out both;
    }

    .site-title {
      font-family: "Playfair Display", "Noto Serif SC", serif;
      font-size: clamp(48px, 10vw, 88px);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      margin-bottom: 16px;
    }

    .site-title a {
      color: var(--ink);
      text-decoration: none;
    }

    .slogan {
      font-size: clamp(16px, 2.4vw, 20px);
      color: var(--muted);
      font-style: italic;
      font-family: "Playfair Display", serif;
      letter-spacing: 0.02em;
    }

    .section-label {
      font-family: "Playfair Display", serif;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--accent);
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      gap: 12px;
      animation: fadeInUp 0.8s ease-out 0.15s both;
    }

    .section-label::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .post-list {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .post-card {
      background: var(--card);
      border: 1px solid var(--line);
      text-decoration: none;
      color: inherit;
      display: flex;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      animation: fadeInUp 0.7s ease-out both;
    }

    .post-card:nth-child(1) { animation-delay: 0.2s; }
    .post-card:nth-child(2) { animation-delay: 0.3s; }
    .post-card:nth-child(3) { animation-delay: 0.4s; }
    .post-card:nth-child(4) { animation-delay: 0.5s; }
    .post-card:nth-child(5) { animation-delay: 0.6s; }

    .post-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 48px rgba(17, 17, 17, 0.1);
      border-color: var(--accent);
    }

    .post-cover {
      flex: 0 0 280px;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      background: #eee;
    }

    .post-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .post-card:hover .post-cover img {
      transform: scale(1.04);
    }

    .post-body {
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .post-date {
      font-size: 12px;
      letter-spacing: 0.1em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 8px;
      font-family: "Playfair Display", serif;
    }

    .post-title {
      font-size: clamp(20px, 3vw, 24px);
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 10px;
      transition: color 0.3s ease;
    }

    .post-card:hover .post-title {
      color: var(--accent);
    }

    .post-excerpt {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.8;
      margin-bottom: 14px;
    }

    .post-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .post-tag {
      font-size: 11px;
      color: var(--accent);
      border: 1px solid var(--line);
      padding: 3px 8px;
      font-family: "Playfair Display", serif;
      letter-spacing: 0.05em;
    }

    .post-arrow {
      margin-top: auto;
      padding-top: 16px;
      font-size: 13px;
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: "Playfair Display", serif;
      letter-spacing: 0.05em;
    }

    .post-arrow::after {
      content: "→";
      transition: transform 0.3s ease;
    }

    .post-card:hover .post-arrow::after {
      transform: translateX(6px);
    }

    .loading, .error {
      text-align: center;
      padding: 48px;
      color: var(--muted);
      font-style: italic;
      border: 1px dashed var(--line);
    }

    footer {
      margin-top: 100px;
      padding-top: 32px;
      border-top: 1px solid var(--line);
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      animation: fadeInUp 0.8s ease-out 0.6s both;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 700px) {
      .container {
        padding: 48px 20px 80px;
      }
      header {
        margin-bottom: 56px;
        padding-bottom: 32px;
      }
      .post-card {
        flex-direction: column;
      }
      .post-cover {
        flex: none;
        width: 100%;
        aspect-ratio: 16 / 9;
      }
      .post-body {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1 class="site-title"><a href="/ai-no-legs/">ai-no-legs</a></h1>
      <p class="slogan">Stay curious, stay real</p>
    </header>

    <main>
      <h2 class="section-label">Articles</h2>
      <div class="post-list" id="post-list">
        <div class="loading">Loading articles…</div>
      </div>
    </main>

    <footer>
      <p>© ai-no-legs · Stay curious, stay real</p>
    </footer>
  </div>

  <script>
    function formatDate(dateStr) {
      return dateStr.replace(/-/g, ' · ');
    }

    function renderArticles(articles) {
      const list = document.getElementById('post-list');
      if (!articles || articles.length === 0) {
        list.innerHTML = '<div class="error">No articles found.</div>';
        return;
      }

      list.innerHTML = articles.map((article, index) => `
        <a class="post-card" href="articles/${article.slug}/" style="animation-delay: ${0.2 + index * 0.1}s">
          <div class="post-cover">
            <img src="${article.cover}" alt="${article.title}" loading="lazy">
          </div>
          <div class="post-body">
            <div class="post-date">${formatDate(article.date)}</div>
            <h3 class="post-title">${article.title}</h3>
            <p class="post-excerpt">${article.excerpt}</p>
            ${article.tags && article.tags.length ? `
              <div class="post-tags">
                ${article.tags.map(tag => `<span class="post-tag">${tag}</span>`).join('')}
              </div>
            ` : ''}
            <span class="post-arrow">Read article</span>
          </div>
        </a>
      `).join('');
    }

    fetch('articles/manifest.json')
      .then(response => {
        if (!response.ok) throw new Error('Failed to load manifest');
        return response.json();
      })
      .then(data => renderArticles(data.articles))
      .catch(error => {
        document.getElementById('post-list').innerHTML = `
          <div class="error">Unable to load articles: ${error.message}</div>
        `;
      });
  </script>
</body>
</html>
